<!doctype html><meta charset="utf-8"><title>Prompts des personnages</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;background:#140d08;color:#f4ead2;max-width:860px;margin:0 auto;padding:18px}h1{color:#e0a93b;font-family:Georgia}.c{background:#1e140d;border:1px solid #4a3320;border-radius:14px;padding:12px 16px;margin:12px 0}.c b{color:#e0a93b}.c p{color:#d8c9a4;font-size:14px;margin:6px 0 10px;user-select:all}button{border:0;border-radius:999px;padding:9px 18px;font:600 14px system-ui;background:#e0a93b;color:#1b1108;cursor:pointer}button.ok{background:#6fcf8a}small{color:#bfae88}</style>
<h1>Prompts des personnages</h1><p><small>Clique « Copier », colle dans Gemini, télécharge l'image dans <code>Téléchargements/colonizer</code>, puis dis-moi le nom du personnage. Garde 3 ou 4 essais par personnage et choisis le plus net.</small></p><div id="l"></div>
<script>fetch("tools/personnages.json").then(r=>r.json()).then(c=>{const l=document.getElementById("l");for(const [k,d] of Object.entries(c.persos)){const t=c.base+" "+d,e=document.createElement("div");e.className="c";e.innerHTML=`<b>${k}</b><p>${t}</p>`;const b=document.createElement("button");b.textContent="Copier";b.onclick=()=>{navigator.clipboard.writeText(t).then(()=>{b.textContent="Copié ✓";b.className="ok";setTimeout(()=>{b.textContent="Copier";b.className=""},1800)})};e.appendChild(b);l.appendChild(e)}})</script>
